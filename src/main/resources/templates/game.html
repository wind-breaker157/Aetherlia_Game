<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta name="_csrf" th:content="${_csrf.token}">

	<meta name="_csrf_header" th:content="${_csrf.headerName}">

	<title>Aetherlia World</title>

	<link rel="stylesheet" href="/css/game.css" th:href="@{/css/game.css}">
</head>

<body>

	<main class="game-page">

		<!-- HEADER -->
		<header class="game-header">

			<div class="game-logo">AETHERLIA-TEST-999</div>

			<div class="player-info">
				👤
				<span th:text="${character.name}">
					Player
				</span>
			</div>

		</header>


		<!-- GAME WORLD -->
		<section id="gameWorld" class="game-world">


			<!-- PLAYER -->
			<div id="player" class="player facing-down"
				th:style="'left: ' + (${position.x} * 100 / 900) + '%; top: ' + (${position.y} * 100 / 500) + '%;'">

				<!-- PLAYER SHADOW -->
				<div class="player-shadow"></div>


				<!-- PLAYER VISUAL -->
				<div class="player-visual">

					<svg class="player-svg" viewBox="0 0 64 100" xmlns="http://www.w3.org/2000/svg">


						<!-- LEGS -->

						<g class="leg-left">

							<rect x="17" y="65" width="9" height="20" rx="4" fill="#334155" stroke="#172033"
								stroke-width="2">
							</rect>

							<ellipse cx="20" cy="87" rx="9" ry="4" fill="#111827">
							</ellipse>

						</g>


						<g class="leg-right">

							<rect x="38" y="65" width="9" height="20" rx="4" fill="#334155" stroke="#172033"
								stroke-width="2">
							</rect>

							<ellipse cx="44" cy="87" rx="9" ry="4" fill="#111827">
							</ellipse>

						</g>


						<!-- BODY -->

						<g class="body-group">

							<rect x="17" y="36" width="30" height="34" rx="9" fill="#2563eb" stroke="#172554"
								stroke-width="2">
							</rect>

							<path d="M32 41 L32 65" stroke="#bfdbfe" stroke-width="2">
							</path>

							<path d="M19 61 L45 61" stroke="#93c5fd" stroke-width="3">
							</path>

						</g>


						<!-- LEFT ARM -->

						<g class="arm-left">

							<rect x="7" y="40" width="9" height="28" rx="5" fill="#2563eb" stroke="#172554"
								stroke-width="2">
							</rect>

							<circle cx="11" cy="69" r="5" fill="#f2c6a0" stroke="#1e293b" stroke-width="1.5">
							</circle>

						</g>


						<!-- RIGHT ARM -->

						<g class="arm-right">

							<rect x="48" y="40" width="9" height="28" rx="5" fill="#2563eb" stroke="#172554"
								stroke-width="2">
							</rect>

							<circle cx="53" cy="69" r="5" fill="#f2c6a0" stroke="#1e293b" stroke-width="1.5">
							</circle>

						</g>


						<!-- NECK -->

						<rect x="27" y="29" width="10" height="11" rx="4" fill="#e8b992">
						</rect>


						<!-- HEAD -->

						<g class="head-group">

							<ellipse cx="32" cy="20" rx="20" ry="21" fill="#f2c6a0" stroke="#1e293b" stroke-width="2">
							</ellipse>


							<!-- HAIR -->

							<path d="M12 18
                               C13 4 23 0 32 0
                               C42 0 51 6 52 18
                               C47 13 43 12 38 12
                               C32 13 27 9 21 14
                               C18 16 15 18 12 18
                               Z" fill="#3f2a20">
							</path>


							<path d="M15 15
                               C20 7 26 8 31 12
                               C36 8 42 8 48 14
                               L45 19
                               C41 15 38 14 34 17
                               C29 12 24 12 19 18
                               Z" fill="#3f2a20">
							</path>


							<!-- EYES -->

							<ellipse cx="24" cy="22" rx="3" ry="4" fill="#111827">
							</ellipse>

							<circle cx="25" cy="21" r="0.9" fill="white">
							</circle>


							<ellipse cx="40" cy="22" rx="3" ry="4" fill="#111827">
							</ellipse>

							<circle cx="41" cy="21" r="0.9" fill="white">
							</circle>


							<!-- NOSE -->

							<path d="M32 24 L30 27 L33 27" fill="none" stroke="#b96f50" stroke-width="1.5"
								stroke-linecap="round">
							</path>


							<!-- MOUTH -->

							<path d="M27 30 Q32 34 37 30" fill="none" stroke="#7f1d1d" stroke-width="1.8"
								stroke-linecap="round">
							</path>


							<!-- EARS -->

							<ellipse cx="12" cy="23" rx="5" ry="7" fill="#e8b992" stroke="#1e293b" stroke-width="1">
							</ellipse>

							<ellipse cx="52" cy="23" rx="5" ry="7" fill="#e8b992" stroke="#1e293b" stroke-width="1">
							</ellipse>

						</g>

					</svg>

				</div>

			</div>


			<!-- TREES -->

			<div class="tree tree-1">
				🌳
			</div>

			<div class="tree tree-2">
				🌳
			</div>

			<div class="tree tree-3">
				🌳
			</div>


			<!-- HOUSE -->

			<div class="house">
				🏠
			</div>


			<!-- GRASS ZONE -->

			<div class="grass-zone">

				<div>
					🌿 🌿 🌿 🌿 🌿
				</div>

				<div>
					🌿 🌿 🌿 🌿 🌿
				</div>

				<div>
					🌿 🌿 🌿 🌿 🌿
				</div>

			</div>


			<!-- COLLISION DEBUG -->

			<div class="collision-debug tree-debug-1"></div>

			<div class="collision-debug tree-debug-2"></div>

			<div class="collision-debug tree-debug-3"></div>

			<div class="collision-debug house-debug"></div>


			<!-- DEBUG POSITION -->

			<div class="debug-position">

				X:
				<strong id="playerX" th:text="${position.x}">
					450
				</strong>

				|

				Y:
				<strong id="playerY" th:text="${position.y}">
					250
				</strong>

			</div>

		</section>


		<!-- CONTROL GUIDE -->

		<section class="control-guide">

			<p>
				<strong>W A S D</strong>
				hoặc
				<strong>↑ ↓ ← →</strong>
				để di chuyển.
			</p>

			<p>
				Nhấn
				<strong>F3</strong>
				để xem Collision.
			</p>

		</section>

	</main>


	<!-- JAVASCRIPT -->

	<script th:src="@{/js/game.js}"></script>

</body>

</html>
