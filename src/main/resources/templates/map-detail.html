<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- CSRF -->
    <meta name="_csrf"
          th:content="${_csrf.token}">

    <meta name="_csrf_header"
          th:content="${_csrf.headerName}">

    <title th:text="${mapArea.name + ' - Aetherlia'}">
        Aetherlia
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/map-detail.css}">


    <!-- ================================================= -->
    <!-- THREE.JS IMPORTMAP                                -->
    <!-- ================================================= -->

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
        }
    }
    </script>

</head>


<body>

<main class="map-detail-page">


    <!-- ================================================= -->
    <!-- HEADER                                            -->
    <!-- ================================================= -->

    <section class="map-header">

        <p class="map-label">
            AETHERLIA WORLD
        </p>

        <h1 th:text="${mapArea.name}">
            Làng Lục Diệp
        </h1>

        <p>
            Điều khiển nhân vật bằng
            <strong>W A S D</strong>
            hoặc
            <strong>↑ ↓ ← →</strong>
        </p>

    </section>


    <!-- ================================================= -->
    <!-- GAME WORLD                                        -->
    <!-- ================================================= -->

    <section class="game-world-wrapper">

        <div id="gameWorld"
             class="game-world"

             th:data-map-number="${mapArea.mapNumber}"
             th:data-map-name="${mapArea.name}"
             th:data-map-terrain="${mapArea.terrain}">


            <!-- ================================================= -->
            <!-- THREE.JS 3D WORLD                                 -->
            <!-- ================================================= -->

            <div id="game-world-3d"
                 class="game-world-3d">
            </div>


            <!-- ================================================= -->
            <!-- 2D DECORATION                                     -->
            <!-- Giữ lại để game.js cũ không bị lỗi                -->
            <!-- ================================================= -->


            <!-- ============================= -->
            <!-- GRASS -->
            <!-- ============================= -->

            <div class="world-decoration grass grass-1">
                🌿
            </div>

            <div class="world-decoration grass grass-2">
                🌿
            </div>

            <div class="world-decoration grass grass-3">
                🌿
            </div>


            <!-- ============================= -->
            <!-- TREES -->
            <!-- ============================= -->

            <div class="world-decoration tree tree-1">
                🌳
            </div>

            <div class="world-decoration tree tree-2">
                🌳
            </div>

            <div class="world-decoration tree tree-3">
                🌳
            </div>


            <!-- ============================= -->
            <!-- HOUSE -->
            <!-- ============================= -->

            <div class="building house">
                🏠
            </div>


            <!-- ================================================= -->
            <!-- PLAYER                                             -->
            <!-- ================================================= -->

            <div id="player"

                 class="player-character player facing-down"

                 th:data-player-name="${character.name}"

                 th:style="'left: ' +
                    (${position.x} * 100 / 900) +
                    '%; top: ' +
                    (${position.y} * 100 / 500) +
                    '%;'">


                <!-- ============================= -->
                <!-- PLAYER NAME                    -->
                <!-- ============================= -->

                <div class="player-name"
                     th:text="${character.name}">
                    Player
                </div>


                <!-- ============================= -->
                <!-- SHADOW                         -->
                <!-- ============================= -->

                <div class="player-shadow">
                </div>


                <!-- ============================= -->
                <!-- 2D PLAYER                      -->
                <!-- game.js vẫn dùng phần này     -->
                <!-- ============================= -->

                <div class="player-visual">

                    <svg class="player-svg"

                         viewBox="0 0 64 100"

                         xmlns="http://www.w3.org/2000/svg">


                        <!-- ================================= -->
                        <!-- LEFT LEG                          -->
                        <!-- ================================= -->

                        <g class="leg-left">

                            <rect

                                x="17"

                                y="65"

                                width="9"

                                height="20"

                                rx="4"

                                fill="#334155"

                                stroke="#172033"

                                stroke-width="2">
                            </rect>

                            <ellipse

                                cx="20"

                                cy="87"

                                rx="9"

                                ry="4"

                                fill="#111827">
                            </ellipse>

                        </g>


                        <!-- ================================= -->
                        <!-- RIGHT LEG                         -->
                        <!-- ================================= -->

                        <g class="leg-right">

                            <rect

                                x="38"

                                y="65"

                                width="9"

                                height="20"

                                rx="4"

                                fill="#334155"

                                stroke="#172033"

                                stroke-width="2">
                            </rect>

                            <ellipse

                                cx="44"

                                cy="87"

                                rx="9"

                                ry="4"

                                fill="#111827">
                            </ellipse>

                        </g>


                        <!-- ================================= -->
                        <!-- BODY                              -->
                        <!-- ================================= -->

                        <g class="body-group">

                            <rect

                                x="17"

                                y="36"

                                width="30"

                                height="34"

                                rx="9"

                                fill="#2563eb"

                                stroke="#172554"

                                stroke-width="2">
                            </rect>

                            <path

                                d="M32 41 L32 65"

                                stroke="#bfdbfe"

                                stroke-width="2">
                            </path>

                            <path

                                d="M19 61 L45 61"

                                stroke="#93c5fd"

                                stroke-width="3">
                            </path>

                        </g>


                        <!-- ================================= -->
                        <!-- LEFT ARM                          -->
                        <!-- ================================= -->

                        <g class="arm-left">

                            <rect

                                x="7"

                                y="40"

                                width="9"

                                height="28"

                                rx="5"

                                fill="#2563eb"

                                stroke="#172554"

                                stroke-width="2">
                            </rect>

                            <circle

                                cx="11"

                                cy="69"

                                r="5"

                                fill="#f2c6a0"

                                stroke="#1e293b"

                                stroke-width="1.5">
                            </circle>

                        </g>


                        <!-- ================================= -->
                        <!-- RIGHT ARM                         -->
                        <!-- ================================= -->

                        <g class="arm-right">

                            <rect

                                x="48"

                                y="40"

                                width="9"

                                height="28"

                                rx="5"

                                fill="#2563eb"

                                stroke="#172554"

                                stroke-width="2">
                            </rect>

                            <circle

                                cx="53"

                                cy="69"

                                r="5"

                                fill="#f2c6a0"

                                stroke="#1e293b"

                                stroke-width="1.5">
                            </circle>

                        </g>


                        <!-- ================================= -->
                        <!-- NECK                              -->
                        <!-- ================================= -->

                        <rect

                            x="27"

                            y="29"

                            width="10"

                            height="11"

                            rx="4"

                            fill="#e8b992">
                        </rect>


                        <!-- ================================= -->
                        <!-- HEAD                              -->
                        <!-- ================================= -->

                        <g class="head-group">


                            <ellipse

                                cx="32"

                                cy="20"

                                rx="20"

                                ry="21"

                                fill="#f2c6a0"

                                stroke="#1e293b"

                                stroke-width="2">
                            </ellipse>


                            <!-- ============================= -->
                            <!-- HAIR                            -->
                            <!-- ============================= -->

                            <path

                                d="M12 18
                                   C13 4 23 0 32 0
                                   C42 0 51 6 52 18
                                   C47 13 43 12 38 12
                                   C32 13 27 9 21 14
                                   C18 16 15 18 12 18
                                   Z"

                                fill="#3f2a20">
                            </path>


                            <path

                                d="M15 15
                                   C20 7 26 8 31 12
                                   C36 8 42 8 48 14
                                   L45 19
                                   C41 15 38 14 34 17
                                   C29 12 24 12 19 18
                                   Z"

                                fill="#3f2a20">
                            </path>


                            <!-- ============================= -->
                            <!-- LEFT EYE                       -->
                            <!-- ============================= -->

                            <ellipse

                                cx="24"

                                cy="22"

                                rx="3"

                                ry="4"

                                fill="#111827">
                            </ellipse>

                            <circle

                                cx="25"

                                cy="21"

                                r="0.9"

                                fill="white">
                            </circle>


                            <!-- ============================= -->
                            <!-- RIGHT EYE                      -->
                            <!-- ============================= -->

                            <ellipse

                                cx="40"

                                cy="22"

                                rx="3"

                                ry="4"

                                fill="#111827">
                            </ellipse>

                            <circle

                                cx="41"

                                cy="21"

                                r="0.9"

                                fill="white">
                            </circle>


                            <!-- ============================= -->
                            <!-- NOSE                           -->
                            <!-- ============================= -->

                            <path

                                d="M32 24 L30 27 L33 27"

                                fill="none"

                                stroke="#b96f50"

                                stroke-width="1.5"

                                stroke-linecap="round">
                            </path>


                            <!-- ============================= -->
                            <!-- MOUTH                          -->
                            <!-- ============================= -->

                            <path

                                d="M27 30 Q32 34 37 30"

                                fill="none"

                                stroke="#7f1d1d"

                                stroke-width="1.8"

                                stroke-linecap="round">
                            </path>


                            <!-- ============================= -->
                            <!-- EARS                           -->
                            <!-- ============================= -->

                            <ellipse

                                cx="12"

                                cy="23"

                                rx="5"

                                ry="7"

                                fill="#e8b992"

                                stroke="#1e293b"

                                stroke-width="1">
                            </ellipse>

                            <ellipse

                                cx="52"

                                cy="23"

                                rx="5"

                                ry="7"

                                fill="#e8b992"

                                stroke="#1e293b"

                                stroke-width="1">
                            </ellipse>

                        </g>

                    </svg>

                </div>

            </div>


            <!-- ================================================= -->
            <!-- POSITION DEBUG                                    -->
            <!-- ================================================= -->

            <div class="debug-position">

                X:

                <strong id="playerX"
                        th:text="${position.x}">
                    450
                </strong>

                |

                Y:

                <strong id="playerY"
                        th:text="${position.y}">
                    250
                </strong>

            </div>


        </div>

    </section>


    <!-- ================================================= -->
    <!-- LOCATION                                          -->
    <!-- ================================================= -->

    <section class="location-panel">

        <p>

            📍 Vị trí:

            <strong id="locationCode"
                    th:text="${position.locationCode}">
                village
            </strong>

        </p>

        <p>

            X:

            <strong th:text="${position.x}">
                450
            </strong>

            |

            Y:

            <strong th:text="${position.y}">
                250
            </strong>

        </p>

    </section>


    <!-- ================================================= -->
    <!-- CONTROLS                                          -->
    <!-- ================================================= -->

    <section class="controls-panel">

        <!-- UP -->

        <button type="button"
                data-direction="UP">

            ↑

        </button>


        <!-- LEFT / DOWN / RIGHT -->

        <div>

            <button type="button"
                    data-direction="LEFT">

                ←

            </button>


            <button type="button"
                    data-direction="DOWN">

                ↓

            </button>


            <button type="button"
                    data-direction="RIGHT">

                →

            </button>

        </div>

    </section>


    <!-- ================================================= -->
    <!-- EXPLORE PANEL                                     -->
    <!-- ================================================= -->

    <section id="explorePanel"

             class="explore-panel"

             th:style="${position.locationCode == 'route_grass'
                        ? 'display:block;'
                        : 'display:none;'}">


        <h2>
            🌿 Route Cỏ Cao
        </h2>


        <p>

            Bạn đang ở khu vực cỏ cao.

            Monster hoang dã có thể xuất hiện.

        </p>


        <a th:href="@{/explore}"

           class="explore-button">

            ⚔️ Khám phá cỏ cao

        </a>

    </section>


    <!-- ================================================= -->
    <!-- BACK                                               -->
    <!-- ================================================= -->

    <a th:href="@{/map}"

       class="back-button">

        ← Quay lại World Map

    </a>


</main>


<!-- ================================================= -->
<!-- GAME.JS                                             -->
<!-- Hệ thống movement/backend hiện tại của anh         -->
<!-- ================================================= -->

<script th:src="@{/js/game.js}">
</script>


<!-- ================================================= -->
<!-- GAME3D.JS                                           -->
<!-- Three.js 3D World                                   -->
<!-- ================================================= -->

<script type="module"
        th:src="@{/js/game3d.js}">
</script>


</body>

</html>
