<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký - Aetherlia</title>
</head>

<body>

    <h1>Đăng ký tài khoản Aetherlia</h1>

    <form th:action="@{/register}" method="post">

        <div>
            <label>Username:</label>
            <input type="text" name="username" required>
        </div>

        <br>

        <div>
            <label>Password:</label>
            <input type="password" name="password" required>
        </div>

        <br>

        <div>
            <label>Email:</label>
            <input type="email" name="email" required>
        </div>

        <br>

        <button type="submit">
            Đăng ký
        </button>

    </form>

    <p th:if="${message}"
       th:text="${message}">
    </p>

</body>

</html>
