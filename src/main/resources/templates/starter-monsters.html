<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chọn Monster khởi đầu - Aetherlia</title>


    <!-- =====================================================
         THREE.JS IMPORT MAP
    ====================================================== -->

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
            }
        }
    </script>


    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        th:href="@{/css/starter-monsters.css}"
    >

</head>


<body>


<main class="starter-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="starter-header">

        <div class="starter-badge">
            AETHERLIA
        </div>

        <h1>
            Chọn Monster khởi đầu
        </h1>

        <p>
            Hãy chọn một Monster để bắt đầu hành trình của bạn.
        </p>

        <p class="starter-note">
            Monster bạn chọn sẽ trở thành người bạn đồng hành đầu tiên.
        </p>

    </header>


    <!-- =====================================================
         STARTER LIST
    ====================================================== -->

    <section class="starter-section">


        <div class="starter-grid">


            <!-- =================================================
                 MONSTER CARD
            ================================================== -->

            <article
                class="monster-card"
                th:each="monster : ${monsters}"
                th:attr="data-monster-name=${monster.name}"
            >


                <!-- =============================================
                     3D VIEW
                ============================================== -->

                <div class="monster-3d-wrapper">

                    <div class="monster-3d-loading">

                        <span class="loading-dot"></span>

                        Đang tải 3D...

                    </div>


                    <div
                        class="monster-3d"
                        aria-label="Mô hình 3D Monster"
                    ></div>


                    <div class="monster-3d-tip">
                        Kéo chuột để xoay
                    </div>

                </div>


                <!-- =============================================
                     MONSTER INFORMATION
                ============================================== -->

                <div class="monster-content">


                    <h2
                        class="monster-name"
                        th:text="${monster.name}"
                    >
                        Monster
                    </h2>


                    <div class="monster-type">

                        <span class="info-label">
                            Type
                        </span>

                        <span
                            class="type-badge"
                            th:text="${monster.type}"
                        >
                            Type
                        </span>

                    </div>


                    <!-- =========================================
                         STATS
                    ========================================== -->

                    <div class="monster-stats">


                        <div class="stat-box">

                            <span class="stat-label">
                                HP
                            </span>

                            <strong
                                th:text="${monster.baseHp}"
                            >
                                0
                            </strong>

                        </div>


                        <div class="stat-box">

                            <span class="stat-label">
                                Attack
                            </span>

                            <strong
                                th:text="${monster.baseAttack}"
                            >
                                0
                            </strong>

                        </div>


                        <div class="stat-box">

                            <span class="stat-label">
                                Defense
                            </span>

                            <strong
                                th:text="${monster.baseDefense}"
                            >
                                0
                            </strong>

                        </div>


                        <div class="stat-box">

                            <span class="stat-label">
                                Speed
                            </span>

                            <strong
                                th:text="${monster.baseSpeed}"
                            >
                                0
                            </strong>

                        </div>


                    </div>


                    <!-- =========================================
                         SELECT FORM
                    ========================================== -->

                    <form
                        th:action="@{/choose-starter}"
                        method="post"
                        class="choose-form"
                    >

                        <input
                            type="hidden"
                            name="monsterId"
                            th:value="${monster.id}"
                        >


                        <button
                            type="submit"
                            class="choose-button"
                        >

                            <span>
                                Chọn Monster này
                            </span>

                            <span class="choose-arrow">
                                →
                            </span>

                        </button>

                    </form>


                </div>

            </article>


        </div>


    </section>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="starter-footer">

        <span>
            Aetherlia
        </span>

        <span>
            •
        </span>

        <span>
            Hành trình của bạn bắt đầu từ đây
        </span>

    </footer>


</main>


<!-- =========================================================
     JAVASCRIPT
========================================================== -->

<script
    type="module"
    th:src="@{/js/starter-monsters.js}"
></script>


</body>

</html>
