<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inventory - Aetherlia</title>

</head>

<body>

    <h1>🎒 Inventory</h1>

    <div th:if="${items.isEmpty()}">
        Inventory đang trống.
    </div>

    <div th:each="item : ${items}">

        <p>

            <strong th:text="${item.itemCode}">
                BASIC_ORB
            </strong>

            ×

            <span th:text="${item.quantity}">
                5
            </span>

        </p>

    </div>

    <a th:href="@{/dashboard}">
        ← Dashboard
    </a>

</body>

</html>
