<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Đăng nhập - Aetherlia</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">

</head>


<body>

    <div class="login-container">

        <h1>Đăng nhập Aetherlia</h1>


        <form th:action="@{/login}" method="post">

            <div class="form-group">

                <label>Username:</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Nhập username"
                    required>

            </div>


            <div class="form-group">

                <label>Password:</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Nhập password"
                    required>

            </div>


            <button
                type="submit"
                class="login-button">

                Đăng nhập

            </button>

        </form>


        <div class="register-link">

            <a href="/register">
                Chưa có tài khoản? Đăng ký
            </a>

        </div>

    </div>

</body>

</html>
