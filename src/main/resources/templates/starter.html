<!DOCTYPE html>

<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Chọn Monster khởi đầu</title>

<link rel="stylesheet"
      th:href="@{/css/tailwind.css}">


</head>

<body class="min-h-screen bg-slate-100">

<div class="min-h-screen flex items-center justify-center p-6">

```
<div class="w-full max-w-6xl">

    <!-- HEADER -->

    <div class="text-center mb-10">

        <div class="text-sm font-semibold
                    uppercase tracking-widest
                    text-blue-600 mb-3">
            Aetherlia
        </div>

        <h1 class="text-4xl md:text-5xl
                   font-black text-slate-900">
            Chọn Monster khởi đầu
        </h1>

        <p class="mt-4 text-slate-600 text-lg">
            Hãy chọn Monster đầu tiên đồng hành cùng anh.
        </p>

    </div>


    <!-- STARTER CARDS -->

    <div class="grid grid-cols-1
                md:grid-cols-3
                gap-6">

        <div th:each="starter : ${starters}"
             class="bg-white rounded-3xl
                    border border-slate-200
                    shadow-lg
                    overflow-hidden
                    transition
                    hover:-translate-y-2
                    hover:shadow-2xl">

            <!-- TOP -->

            <div class="p-8 text-center">

                <!-- ICON -->

                <div class="mx-auto mb-6
                            w-24 h-24
                            rounded-full
                            flex items-center justify-center
                            text-5xl
                            bg-slate-100">

                    <span th:if="${starter.type.name() == 'FIRE'}">
                        🔥
                    </span>

                    <span th:if="${starter.type.name() == 'WATER'}">
                        💧
                    </span>

                    <span th:if="${starter.type.name() == 'GRASS'}">
                        🌿
                    </span>

                    <span th:if="${starter.type.name() != 'FIRE'
                              and starter.type.name() != 'WATER'
                              and starter.type.name() != 'GRASS'}">
                        ⭐
                    </span>

                </div>


                <!-- NAME -->

                <h2 class="text-3xl font-black
                           text-slate-900"
                    th:text="${starter.name}">
                    Monster
                </h2>


                <!-- TYPE -->

                <div class="mt-3">

                    <span
                        class="inline-flex
                               px-4 py-2
                               rounded-full
                               text-sm
                               font-bold
                               bg-blue-100
                               text-blue-700"
                        th:text="${starter.type}">
                        TYPE
                    </span>

                </div>


                <!-- RARITY -->

                <p class="mt-4
                          text-slate-500"
                   th:text="'Rarity: ' + ${starter.rarity}">
                    Rarity
                </p>

            </div>


            <!-- STATS -->

            <div class="px-8 pb-8">

                <div class="grid grid-cols-2 gap-3">

                    <div class="rounded-2xl
                                bg-slate-50
                                p-4">

                        <div class="text-xs
                                    text-slate-500
                                    uppercase
                                    font-bold">
                            HP
                        </div>

                        <div class="text-xl
                                    font-black
                                    text-slate-900"
                             th:text="${starter.baseHp}">
                            0
                        </div>

                    </div>


                    <div class="rounded-2xl
                                bg-slate-50
                                p-4">

                        <div class="text-xs
                                    text-slate-500
                                    uppercase
                                    font-bold">
                            Attack
                        </div>

                        <div class="text-xl
                                    font-black
                                    text-slate-900"
                             th:text="${starter.baseAttack}">
                            0
                        </div>

                    </div>


                    <div class="rounded-2xl
                                bg-slate-50
                                p-4">

                        <div class="text-xs
                                    text-slate-500
                                    uppercase
                                    font-bold">
                            Defense
                        </div>

                        <div class="text-xl
                                    font-black
                                    text-slate-900"
                             th:text="${starter.baseDefense}">
                            0
                        </div>

                    </div>


                    <div class="rounded-2xl
                                bg-slate-50
                                p-4">

                        <div class="text-xs
                                    text-slate-500
                                    uppercase
                                    font-bold">
                            Speed
                        </div>

                        <div class="text-xl
                                    font-black
                                    text-slate-900"
                             th:text="${starter.baseSpeed}">
                            0
                        </div>

                    </div>

                </div>


                <!-- CHOOSE BUTTON -->

                <form th:action="@{/starter/choose}"
                      method="post"
                      class="mt-6">

                    <!-- QUAN TRỌNG:
                         gửi ID chứ không gửi tên -->

                    <input
                        type="hidden"
                        name="starterId"
                        th:value="${starter.id}"
                    >

                    <!-- CSRF -->

                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >

                    <button
                        type="submit"
                        class="w-full
                               py-4
                               rounded-2xl
                               bg-blue-600
                               hover:bg-blue-700
                               text-white
                               font-black
                               text-lg
                               transition
                               shadow-lg
                               hover:shadow-xl">

                        Chọn
                        <span th:text="${starter.name}">
                            Monster
                        </span>

                    </button>

                </form>

            </div>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="text-center mt-8">

        <p class="text-sm text-slate-500">
            Monster đã chọn sẽ trở thành thành viên đầu tiên trong Team.
        </p>

    </div>

</div>
```

</div>

</body>

</html>
